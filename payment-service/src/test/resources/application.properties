spring.application.name=payment-service-test
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:h2:mem:paymenttest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.kafka.bootstrap-servers=127.0.0.1:19092
spring.kafka.consumer.group-id=payment-service
spring.kafka.listener.auto-startup=false

app.kafka.topics.stock-updated-dlt=saga.inventory.stock_updated.DLT

app.gateway.secret=test-secret
