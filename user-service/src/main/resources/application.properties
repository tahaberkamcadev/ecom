spring.application.name=user-service
server.port=8081

spring.docker.compose.enabled=false

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/userservicedb}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT - override with environment variable in production
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
info.app.name=user-service
info.app.description=E-Commerce User Service
info.app.version=1.0.0

# Swagger Configuration (disabled in production for security)
app.swagger.enabled=${SWAGGER_ENABLED:true}

# Local demo data (disable in production)
app.seed.enabled=${APP_SEED_ENABLED:true}

# Logging — application events only; framework noise suppressed
logging.level.root=WARN
logging.level.com.tahaberkamcadev=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework=WARN
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
