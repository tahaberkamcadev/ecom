spring.application.name=user-service
server.port=8081

# Docker Compose lifecycle is managed externally (docker compose up -d)
spring.docker.compose.lifecycle-management=none

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/userservicedb}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT - override with environment variable in production
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=user-service
info.app.description=E-Commerce User Service
info.app.version=1.0.0

# Spring Cloud Stream / Events - Apache Kafka
spring.cloud.stream.bindings.userEvents-out-0.destination=user-events
spring.cloud.stream.bindings.userCreated-out-0.destination=user-created
spring.cloud.stream.bindings.userUpdated-out-0.destination=user-updated
spring.cloud.stream.bindings.userDeleted-out-0.destination=user-deleted
spring.cloud.stream.bindings.userVerified-out-0.destination=user-verified
spring.cloud.stream.default-binder=kafka

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Kafka Consumer (for potential future use)
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:user-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Development mode: Enable/disable Kafka (set to false for local development without Kafka)
app.events.enabled=${EVENTS_ENABLED:true}
app.kafka.enabled=${KAFKA_ENABLED:false}

# Swagger Configuration (disabled in production for security)
app.swagger.enabled=${SWAGGER_ENABLED:true}

# Logging
logging.level.com.tahaberkamcadev=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
