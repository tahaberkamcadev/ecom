spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# Routes - correct prefix for spring-cloud-starter-gateway-server-webmvc
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/**

spring.cloud.gateway.server.webmvc.routes[1].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${INVENTORY_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${ORDER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${PAYMENT_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.server.webmvc.routes[4].id=review-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${REVIEW_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/reviews/**

spring.cloud.gateway.server.webmvc.routes[5].id=projection-service
spring.cloud.gateway.server.webmvc.routes[5].uri=${PROJECTION_SERVICE_URL:http://localhost:8087}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/catalog/**

# JWT (same secret as user-service)
jwt.secret-key=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Internal gateway secret — injected into every upstream request
app.gateway.secret=${GATEWAY_SECRET}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=api-gateway
info.app.description=E-Commerce API Gateway

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.tahaberkamcadev.api_gateway=DEBUG
