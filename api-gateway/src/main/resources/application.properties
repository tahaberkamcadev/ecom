spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# Routes - correct prefix for spring-cloud-starter-gateway-server-webmvc
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/**

spring.cloud.gateway.server.webmvc.routes[1].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${INVENTORY_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webmvc.routes[2].id=review-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${REVIEW_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/reviews/**

spring.cloud.gateway.server.webmvc.routes[3].id=projection-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${PROJECTION_SERVICE_URL:http://localhost:8087}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/catalog/**

# JWT (same secret as user-service)
jwt.secret-key=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Shared secret — injected on upstream requests to header-trusting services
app.gateway.secret=${GATEWAY_SECRET}

# CORS (for SPA clients hitting the gateway)
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:4200}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=api-gateway
info.app.description=E-Commerce API Gateway

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.tahaberkamcadev.api_gateway=DEBUG
