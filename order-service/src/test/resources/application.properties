spring.application.name=order-service-test
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:h2:mem:ordertest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.kafka.bootstrap-servers=127.0.0.1:19092
spring.kafka.consumer.group-id=order-service
spring.kafka.listener.auto-startup=false

app.kafka.topics.stock-updated-dlt=saga.inventory.stock_updated.DLT
app.kafka.topics.stock-failed-dlt=saga.inventory.stock_failed.DLT
app.kafka.topics.payment-failed-dlt=saga.payment.payment_failed.DLT
app.kafka.topics.payment-completed-dlt=saga.payment.payment_completed.DLT

app.gateway.secret=test-secret
