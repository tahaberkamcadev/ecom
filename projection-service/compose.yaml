services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: projectiondb
      POSTGRES_USER: projection
      POSTGRES_PASSWORD: projection
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projection -d projectiondb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
