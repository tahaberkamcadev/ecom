spring.datasource.url=jdbc:h2:mem:projectiondb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.kafka.bootstrap-servers=localhost:9093
spring.kafka.consumer.group-id=projection-service-test
spring.kafka.listener.auto-startup=false

app.cache.redis.enabled=false
app.elasticsearch.enabled=false
spring.cache.type=simple
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchClientAutoConfiguration,org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchRestClientAutoConfiguration,org.springframework.boot.data.elasticsearch.autoconfigure.DataElasticsearchAutoConfiguration,org.springframework.boot.data.elasticsearch.autoconfigure.DataElasticsearchRepositoriesAutoConfiguration
app.gateway.secret=test-secret

app.kafka.topics.stock-updated-dlt=saga.inventory.stock_updated.DLT
app.kafka.topics.payment-failed-dlt=saga.payment.payment_failed.DLT
app.kafka.topics.payment-completed-dlt=saga.payment.payment_completed.DLT
app.kafka.topics.product-created-dlt=saga.inventory.product_created.DLT
app.kafka.topics.product-updated-dlt=saga.inventory.product_updated.DLT
app.kafka.topics.product-in-stock-dlt=saga.inventory.product_in_stock.DLT
app.kafka.topics.product-out-of-stock-dlt=saga.inventory.product_out_of_stock.DLT
app.kafka.topics.review-created-dlt=saga.review.review_created.DLT
