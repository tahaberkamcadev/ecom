spring.application.name=projection-service
server.port=${SERVER_PORT:8087}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/projectiondb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:projection}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:projection}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:projection-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

app.elasticsearch.enabled=${APP_ELASTICSEARCH_ENABLED:true}

app.cache.product-ttl=${APP_CACHE_PRODUCT_TTL:PT30M}
app.cache.redis.enabled=${APP_CACHE_REDIS_ENABLED:true}
app.scheduling.processed-events-cleanup-cron=${APP_SCHEDULING_PROCESSED_EVENTS_CLEANUP_CRON:0 0 0 * * *}
app.kafka.topics.stock-updated-dlt=saga.inventory.stock_updated-dlt
app.kafka.topics.payment-failed-dlt=saga.payment.payment_failed-dlt
app.kafka.topics.payment-completed-dlt=saga.payment.payment_completed-dlt
app.kafka.topics.product-created-dlt=saga.inventory.product_created-dlt
app.kafka.topics.product-updated-dlt=saga.inventory.product_updated-dlt
app.kafka.topics.product-deleted-dlt=saga.inventory.product_deleted-dlt
app.kafka.topics.product-in-stock-dlt=saga.inventory.product_in_stock-dlt
app.kafka.topics.product-out-of-stock-dlt=saga.inventory.product_out_of_stock-dlt
app.kafka.topics.review-created-dlt=saga.review.review_created-dlt

app.gateway.secret=${GATEWAY_SECRET}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
info.app.name=projection-service
info.app.description=CQRS read model and catalog API
